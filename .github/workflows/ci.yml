name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # The build runs with NO secrets present. That's deliberate: it verifies the app
      # degrades gracefully without API keys rather than failing to compile — the same
      # property demo mode depends on.
      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
